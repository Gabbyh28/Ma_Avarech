name: Build Android app

on:
  push:
    branches: [main, claude/build-application-0vbptu]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Copy web app into the Android project
        run: |
          npm run build:www
          npx cap sync android
      - name: Restore upload key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build APK and App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease -PversionCode=${{ github.run_number }}
      - name: Verify the app
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BADGE=$($AAPT dump badging $APK)
          echo "$BADGE" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label)" | while read -r line; do echo "::notice::$line"; done
          for f in index.html src/app.js src/foods.js fonts/fonts.css privacy.html icons/icon-192.png; do
            unzip -l $APK "assets/public/$f" > /dev/null || { echo "::error::missing assets/public/$f"; exit 1; }
          done
          echo "::notice::web app files present in APK ($(unzip -l $APK 'assets/public/*' | tail -1 | awk '{print $2}') files)"
      - name: Report signing
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "::notice::App Bundle signed with the upload key"; else echo "::warning::No upload key secret – the App Bundle is unsigned and cannot be uploaded to Google Play yet"; fi
      - name: Name the test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ma-avarech.apk
      - uses: actions/upload-artifact@v5
        with:
          name: ma-avarech-apk-for-testing
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v5
        with:
          name: ma-avarech-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Publish test APK to the "android-test" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: גרסת בדיקה לאנדרואיד
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            קובץ APK להתקנה ישירה בטלפון, לבדיקה לפני החנות.
            בטלפון: מורידים את `ma-avarech.apk`, פותחים, ומאשרים "התקנה ממקורות לא ידועים".
            נבנה מהקומיט ${{ github.sha }}.
          files: ma-avarech.apk
